body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
input,select,textarea,button{font:inherit;color:inherit}
@keyframes tss-caret{50%{opacity:0}}.tss-caret{animation:tss-caret .9s steps(1) infinite;margin-left:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.boot{display:grid;place-items:center;height:100%;color:var(--muted);font-weight:600;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
</style>

  return <div ref={ref} className="relative">
    <div className="flex h-12 items-center gap-2 rounded-xl border border-line bg-surface px-3.5 focus-within:border-brand">
      <span className="text-muted">{Icn&&<Icn/>}</span>
      <input id={id} role="combobox" aria-expanded={open} aria-controls={id+'-lista'} aria-autocomplete="list" aria-activedescendant={open&&list[hi]?id+'-opt-'+hi:undefined} autoComplete="off"
        className="h-full min-w-0 flex-1 bg-transparent text-[16px] outline-none placeholder:text-muted"
        placeholder={value?value.label:placeholder} value={open?q:(value?value.label:'')}
        onFocus={()=>{setOpen(true);setHi(0)}} onChange={e=>{setQ(e.target.value);setOpen(true);setHi(0)}}
        onKeyDown={e=>{if(e.key==='ArrowDown'){e.preventDefault();setHi(h=>Math.min(h+1,list.length-1))}else if(e.key==='ArrowUp'){e.preventDefault();setHi(h=>Math.max(h-1,0))}else if(e.key==='Enter'&&open&&list[hi]){e.preventDefault();pick(list[hi])}else if(e.key==='Escape'){setOpen(false)}}}/>
      {value&&!open&&<button type="button" aria-label="Borrar" onClick={()=>onChange(null)} className="text-muted hover:text-ink"><I.X/></button>}
    </div>
    {open&&<ul id={id+'-lista'} role="listbox" className="absolute z-30 mt-1 max-h-72 w-full overflow-auto rounded-xl border border-line bg-surface py-1 shadow-xl">
      {list.length===0&&<li className="px-4 py-3 text-muted">No encontramos ese lugar. Escríbelo en comentarios o pregúntanos por WhatsApp.</li>}
      {list.map((o,i)=>{const head=o.group!==lastGroup;lastGroup=o.group;return <React.Fragment key={o.key}>
        {head&&<li className="px-4 pb-1 pt-2 text-[12px] font-bold uppercase tracking-wider text-muted" role="presentation">{o.group}</li>}
        <li id={id+'-opt-'+i} role="option" aria-selected={i===hi} onMouseEnter={()=>setHi(i)} onMouseDown={e=>{e.preventDefault();pick(o)}}
          className={`flex cursor-pointer items-center justify-between gap-3 px-4 py-2.5 ${i===hi?'bg-sunken':''}`}>
          <span className="min-w-0 truncate">{o.label}</span>{o.right&&<span className="shrink-0 text-[13px] font-semibold text-muted tnum">{o.right}</span>}
        </li></React.Fragment>})}
    </ul>}
  </div>;
}

function Notice({tone='warn',icon,title,children,action,onClick}){
  const T={bad:'bg-badsoft text-bad',warn:'bg-warnsoft text-warn',info:'bg-infosoft text-info',ok:'bg-oksoft text-ok'}[tone];
  const Tag=onClick?'button':'div';
  return <Tag type={onClick?'button':undefined} onClick={onClick} role={onClick?undefined:'status'}
    className={`flex w-full items-center gap-3 rounded-xl border border-line bg-surface p-3 text-left text-[14px] text-ink ${onClick?'transition hover:bg-sunken':''}`}>
    <span className={`grid h-9 w-9 shrink-0 place-items-center rounded-full ${T}`}>{icon||<I.Alert size={18}/>}</span>
    <span className="min-w-0 flex-1"><span className="block font-semibold leading-snug">{title}</span>{children&&<span className="mt-0.5 block text-[13px] text-muted">{children}</span>}</span>
    {action}{onClick&&<I.Chev className="shrink-0 text-muted"/>}
  </Tag>;
}

/* ---------- Formulario de reserva (una sola pantalla) ---------- */
const emptyForm = (staff) => ({from:null,to:null,date:'',time:'',roundTrip:false,retDate:'',retTime:'',pax:1,luggage:{s:0,m:0,l:0},extras:{},
  wheelFoldable:true,name:'',prefix:'+34',phone:'',email:'',flight:'',notes:'',payment:'online',terms:false,needs:null,channel:'web'});

function BookingForm({settings,onCreate,staff,panel,onSeeInPanel,bookings,prefill}){
  const [showExtras,setShowExtras]=useState(false); const [arrive,setArrive]=useState(false);
  const [f,setF]=useState(()=>({...emptyForm(staff),...(prefill||{})})); const [errors,setErrors]=useState({}); const [done,setDone]=useState(null); const [paying,setPaying]=useState(null);
  const ERR_OF={from:'route',to:'route',date:'date',time:'time',retDate:'ret',retTime:'ret',pax:'pax',name:'name',phone:'phone',email:'email',terms:'terms',needs:'needs'};
  const set=(k,v)=>{setF(p=>({...p,[k]:v,...(k==='date'&&v&&p.retDate<v?{retDate:v}:{}),...(k==='extras'&&Object.values(v).some(Boolean)?{needs:'yes'}:{})}));if(k==='extras'){setErrors(e=>{if(!e.pax&&!e.needs)return e;const n={...e};delete n.pax;if(Object.values(v).some(Boolean))delete n.needs;return n})}const ek=ERR_OF[k];if(ek)setErrors(e=>{if(!e[ek])return e;const n={...e};delete n[ek];return n})};
  const ssOpts=useMemo(()=>PUNTOS_SS.map(n=>({key:'ss-'+n,label:n,type:'ss',group:'Santa Susanna · recogida en tu hotel'})),[]);
  const destOpts=useMemo(()=>settings.tarifas.map(t=>({key:t.id,label:t.name,type:'dest',group:CAT_LABEL[t.cat],right:'desde '+eur(t.day)})),[settings.tarifas]);
  const HUB=/Aeropuerto|Sants|Port de|AVE|BUS/;
  const hubOpts=useMemo(()=>destOpts.filter(o=>HUB.test(o.label)).map(o=>({...o,group:'Aeropuertos, estaciones y puerto'})),[destOpts]);
  const CAT_ORDER=['cerca','maresme','costa','barcelona','girona','local'];
  const restOpts=useMemo(()=>destOpts.filter(o=>!HUB.test(o.label)).map(o=>({...o,cat:(settings.tarifas.find(x=>x.id===o.key)||{}).cat})).sort((a,b)=>CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat)),[destOpts]);
  const destAll=[...hubOpts,...restOpts];
  // Desde: primero los hoteles (recogida habitual). Hasta: primero aeropuertos y destinos.
  const fromOpts = f.to ? (f.to.type==='ss'?destAll:ssOpts) : [...ssOpts,...destAll];
  const toOpts = f.from ? (f.from.type==='ss'?destAll:ssOpts) : [...destAll,...ssOpts];
  const ss = f.from&&f.from.type==='ss'?f.from:(f.to&&f.to.type==='ss'?f.to:null);
  const dest = f.from&&f.from.type==='dest'?f.from:(f.to&&f.to.type==='dest'?f.to:null);
  const dir = f.from&&f.from.type==='ss'?'out':'in';
  const maxSeats=settings.seats||4; const seats = seatsOf(f.pax,f.extras); const vehicle = vehicleFor(seats,maxSeats);
  const lead = d => dest&&d==='in'?legMin(dest.label,settings):0;
  // Flota con reparto en la central: el formulario no bloquea horas por disponibilidad de un coche
  const clash = [];
  const retDir = dir==='out'?'in':'out';
  const clashRet = [];
  // Ida y vuelta el mismo día: la vuelta no puede empezar antes de que el taxi acabe la ida
  const pairClash = f.roundTrip&&ss&&dest&&f.time&&f.retTime&&f.retDate===f.date && (()=>{const a=spanOf({time:f.time,dest:dest.label,dir},settings),b=spanOf({time:f.retTime,dest:dest.label,dir:retDir},settings);return a.a<b.e&&b.a<a.e})();
  const consult = !staff && vehicle==='grupo';
  const waVan = `https://wa.me/34937678571?text=${encodeURIComponent(`Hola, somos ${seats} personas y queremos reservar ${seats<=8?'una van':'varios vehículos'}${ss&&dest?`: ${tripName({dir,ss:ss.label,dest:dest.label})}`:''}${f.date?` el ${dayLabel(f.date)}${f.time?` a las ${f.time}`:''}`:''}. ¿Qué precio tiene?`)}`;
  const q = ss&&dest ? quote({dest:dest.label,time:f.time||'12:00',date:f.date,retDate:f.retDate,retTime:f.retTime||'12:00',roundTrip:f.roundTrip,extras:f.extras,vehicle},settings) : null;
  const airport = dest && /Aeropuerto/.test(dest.label);
  const bigBags = f.luggage.l + f.luggage.m;
  const quick = ['Aeropuerto Barcelona-El Prat','Aeropuerto Girona-Costa Brava','Barcelona Sants','Port de Barcelona'];
  const setQuick = (side,name) => { const o=destOpts.find(x=>x.label===name); const other=side==='from'?'to':'from';
    setF(p=>({...p,[side]:o,[other]:p[other]&&p[other].type==='dest'?null:p[other]}));
    setErrors(e=>{if(!e.route)return e;const n={...e};delete n.route;return n});
    if(!f[other]||f[other].type==='dest') setTimeout(()=>{const el=document.getElementById(other==='from'?'f-desde':'f-hasta');el&&el.focus()},0); };
  const Chips = ({side}) => { const cur=f[side]; return <div className="flex flex-wrap items-center gap-2 pb-1 pt-1"><span className="shrink-0 text-[13px] font-semibold text-muted">{side==='from'?'Frecuentes:':'Frecuentes:'}</span>
    {quick.map(n=>{const on=!!cur&&cur.label===n;return <button type="button" key={n} onClick={()=>setQuick(side,n)} aria-pressed={on} className={`shrink-0 whitespace-nowrap rounded-full border px-3 py-1.5 text-[13px] font-semibold ${on?'border-brand bg-brandsoft text-brandink':'border-line hover:border-brand'}`}>{n.replace('Aeropuerto ','Aeropuerto de ').replace('-El Prat','').replace('-Costa Brava','')}</button>})}</div>; };

  function submit(e){
    e.preventDefault();
    const er={};
    if(!ss||!dest) er.route='Elige desde dónde y a dónde vas.';
    if(!f.date) er.date='Elige el día.'; if(!f.time) er.time='Elige la hora de recogida.';
    if(f.date && f.date<TODAY) er.date='La fecha ya ha pasado.';
    if(!staff&&f.date===TODAY&&f.time&&f.time<nowHM()) er.time='Esa hora ya ha pasado. Elige una hora más tarde.';
    if(f.roundTrip&&(!f.retDate||!f.retTime)) er.ret='Indica el día y la hora de vuelta.';
    else if(f.roundTrip&&f.time&&(f.retDate+f.retTime)<=(f.date+f.time)) er.ret='La vuelta tiene que ser después de la ida.';
    else if(pairClash) er.ret='La vuelta es demasiado pronto: a esa hora aún estarás haciendo el viaje de ida.';
    if(vehicle==='grupo') er.pax=seats<=8?`Para ${seats} personas usamos una van de hasta 8 plazas (con suplemento). Escríbenos por WhatsApp o llama al 937 67 85 71 y te damos el precio.`:`Para más de 8 personas usamos varios vehículos. Llámanos al 937 67 85 71 y lo organizamos.`;
    if(!f.name.trim()) er.name='Escribe tu nombre.';
    if(f.phone.replace(/\D/g,'').length<6) er.phone='Escribe un teléfono válido.';
    if(f.email.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) er.email='Escribe un email válido.';
    else if(!staff&&!f.email.trim()) er.email='Necesitamos tu email para enviarte la confirmación.';
    if(!staff&&!f.terms) er.terms='Acepta las condiciones para reservar.';
    if(!staff&&f.needs!=='no'&&!Object.values(f.extras).some(Boolean)) er.needs=f.needs==='yes'?'Elige qué necesitas o marca «No, nada más».':'Dinos si necesitas algo más: marca «No, nada más» o elige lo que necesitas.';
    setErrors(er); if(Object.keys(er).length){ const first=document.querySelector('[data-err="1"]'); if(first) first.scrollIntoView({behavior:'smooth',block:'center'}); return; }
    const tel=f.phone.trim(); const pre=tel.startsWith('+')?(Object.keys(LANG_BY_PREFIX).find(p=>tel.startsWith(p))||''):f.prefix;
    const now=new Date().toISOString();
    const b={id:newCode(),createdAt:now,channel:f.channel,date:f.date,time:f.time,dir,ss:ss.label,dest:dest.label,pax:f.pax,luggage:f.luggage,
      extras:f.extras,vehicle,flight:f.flight.trim(),name:f.name.trim(),phone:tel.startsWith('+')?tel:(f.prefix+' '+tel).trim(),email:f.email.trim(),
      notes:[f.extras.ruedas&&!f.wheelFoldable?'Silla de ruedas NO plegable: buscar taxi con rampa.':'',f.notes.trim()].filter(Boolean).join(' '),
      lang:LANG_BY_PREFIX[pre]||'EN',payment:f.payment,
      // Solo cuenta como pagado si lo paga el cliente en la web; si la toma el equipo, queda «a cobrar» hasta marcarlo
      paid:!staff,status:'nueva',driverId:null,roundTrip:f.roundTrip,retDate:f.roundTrip?f.retDate:null,retTime:f.roundTrip?f.retTime:null,
      total:q.out.price+(f.roundTrip?q.extras/2:q.extras),night:q.out.night,log:[{at:now,text:'Reserva recibida desde la web'},{at:now,text:'Email enviado a la central'},...(f.email.trim()?[{at:now,text:'Email de reserva recibida enviado'}]:[])]};
    const list=[b];
    if(f.roundTrip){ const r={...b,id:newCode(),date:f.retDate,time:f.retTime,dir:retDir,roundTrip:false,retDate:null,retTime:null,isReturn:true,linked:b.id,
      flight:'',total:q.ret.price+q.extras/2,night:q.ret.night,log:[{at:now,text:`Vuelta de la reserva ${b.id}`}]}; b.linked=r.id; list.push(r); }
    const finish=()=>{onCreate(list); setDone({...b,grand:q.total,retId:b.linked}); setF(emptyForm(staff)); setErrors({}); window.scrollTo(0,0);};
    if(!staff&&f.payment==='online'){ setPaying({total:q.total,finish:m=>{list.forEach(x=>{x.paid=true;x.log.push({at:new Date().toISOString(),text:`Pagado con ${m} (pedido de WooCommerce)`})});finish();}}); window.scrollTo(0,0); return; }
    if(staff&&f.payment==='online') list.forEach(x=>{x.paid=false;x.log.push({at:now,text:'Enlace de pago creado'})});
    finish();
  }

  if(paying) return <PayDemo total={paying.total} onPay={m=>{const p=paying;setPaying(null);p.finish(m)}} onBack={()=>setPaying(null)}/>;
  if(done) return <Confirmation b={done} onNew={()=>setDone(null)} onSeeInPanel={onSeeInPanel} bookings={bookings}/>;

  const errCount=Object.keys(errors).length;
  return <form onSubmit={submit} noValidate className="mx-auto grid max-w-2xl gap-5 pb-28 md:max-w-none lg:grid-cols-[minmax(0,1fr)_300px] lg:items-start lg:pb-0">
    <div className={`grid min-w-0 content-start gap-4 ${staff?'md:grid-cols-2':''}`}>
    {errCount>0&&<div role="alert" className={staff?'md:col-span-2':''}><Notice tone="bad" title={`Revisa ${errCount===1?'el campo marcado':`los ${errCount} campos marcados`}`}>Faltan datos para completar la reserva.</Notice></div>}
    {staff&&<div className="flex flex-wrap items-center gap-2 rounded-2xl border border-line bg-surface p-3 md:col-span-2">
      <span className="text-[13px] font-semibold uppercase tracking-wide text-muted">Reserva tomada por</span>
      {Object.entries(CHANNEL).map(([k,v])=><button type="button" key={k} onClick={()=>set('channel',k)} className={`rounded-full px-3 py-1.5 text-[14px] font-semibold ${f.channel===k?'bg-deep text-white':'bg-sunken text-ink'}`}>{v}</button>)}
    </div>}

    <Section title={staff?"Trayecto":"1. ¿A dónde vas?"} icon={I.Route}>
      {!staff&&!q&&<div className="mb-4">
        <h3 className="mb-2 text-[14px] font-semibold text-ink">Traslados en taxi más reservados</h3>
        <div className="mb-3 grid grid-cols-2 gap-1 rounded-full bg-sunken p-1" role="group" aria-label="Sentido del viaje">
          {[[false,'Salgo de Santa Susanna'],[true,'Llego a Santa Susanna']].map(([v,l])=><button type="button" key={l} aria-pressed={arrive===v} onClick={()=>setArrive(v)}
            className={`min-h-[44px] rounded-full px-3 text-[14px] font-semibold leading-tight ${arrive===v?'bg-deep text-white':'text-ink hover:bg-surface'}`}>{l}</button>)}
        </div>
        <div className="grid grid-cols-2 gap-2">{quick.map(n=>{const t=settings.tarifas.find(x=>x.name===n);if(!t)return null;const on=(arrive?f.from:f.to)&&(arrive?f.from:f.to).label===n;const dur=(t.info.split('·')[1]||'').trim();
          return <button type="button" key={n} onClick={()=>setQuick(arrive?'from':'to',n)} aria-pressed={!!on} className={`rounded-xl border p-3 text-left transition ${on?'border-brand bg-brandsoft':'border-line hover:border-brand'}`}>
            <span className="block text-[12px] font-semibold uppercase tracking-wide text-muted">{arrive?'→ Santa Susanna desde':'Santa Susanna →'}</span><span className="block text-[14px] font-semibold leading-snug">{n.replace('Aeropuerto Barcelona-El Prat','Aeropuerto de Barcelona (El Prat)').replace('Aeropuerto Girona-Costa Brava','Aeropuerto de Girona')}</span>
            <span className="mt-1 block text-[13px] text-muted">desde <b className="text-[15px] text-ink tnum">{eur(t.day)}</b></span>{dur&&<span className="block text-[12px] text-muted">{dur}</span>}</button>})}</div>
        <p className="mt-2 text-[13px] text-muted">{arrive?'Después, elige tu hotel o dirección en Santa Susanna.':'Después, elige tu hotel o dirección de recogida en Santa Susanna.'}</p>
      </div>}
      <div className="grid gap-2" data-err={errors.route?1:0}>
        <Field label="Desde" htmlFor="f-desde"><Combo id="f-desde" value={f.from} onChange={v=>set('from',v)} options={fromOpts} placeholder="Hotel, aeropuerto, estación…" icon={I.Pin}/></Field>
        {staff&&<Chips side="from"/>}
        <div className="flex justify-center"><button type="button" aria-label="Intercambiar origen y destino" onClick={()=>setF(p=>({...p,from:p.to,to:p.from}))}
          className="grid h-10 w-10 place-items-center rounded-full border border-line bg-surface text-brandink hover:bg-sunken"><I.Swap/></button></div>
        <Field label="Hasta" htmlFor="f-hasta" error={errors.route}><Combo id="f-hasta" value={f.to} onChange={v=>set('to',v)} options={toOpts} placeholder="¿A dónde vas?" icon={I.Flag}/></Field>
        {staff&&<Chips side="to"/>}
      </div>
      {q&&<div className="mt-4 flex items-center justify-between gap-3 rounded-xl bg-brandsoft p-3.5">
        <div className="min-w-0"><div className="text-[13px] font-semibold text-brandink">{consult?'Van con suplemento':'Precio fijo'} · {q.out.night?'tarifa de noche':'tarifa de día'}{f.roundTrip?' · ida y vuelta':''}</div>
          <div className="truncate text-[14px] text-ink">{q.tariff.info||CAT_LABEL[q.tariff.cat]}</div></div>
        {consult?<div className="text-[16px] font-bold text-ink">{seats<=8?'Van: a consultar':'A consultar'}</div>:<div className="text-[26px] font-extrabold text-ink tnum">{eur(q.total)}</div>}
      </div>}
    </Section>

    <Section title={staff?"Cuándo":"2. ¿Cuándo te recogemos?"} icon={I.Cal}>
      <div className="grid gap-3 sm:grid-cols-2">
        <Field label="Día" htmlFor="f-dia" error={errors.date}><input id="f-dia" type="date" min={TODAY} value={f.date} onChange={e=>set('date',e.target.value)} className={inputCls} data-err={errors.date?1:0}/></Field>
        <Field label="Hora de recogida" htmlFor="f-hora" error={errors.time} hint={f.time?(isHoliday(f.date,settings)?'Tarifa de fin de semana y festivos':isNight(f.time,settings,f.date)?`Tarifa de noche (de ${settings.nightFrom} a ${settings.nightTo})`:'Tarifa de día'):''}>
          <div className="flex gap-2"><input id="f-hora" type="time" value={f.time} onChange={e=>set('time',e.target.value)} className={inputCls} data-err={errors.time?1:0}/>
          {staff&&<button type="button" onClick={()=>{set('date',TODAY);set('time',nowHM())}} className="shrink-0 rounded-xl border border-line px-3.5 text-[14px] font-semibold hover:border-brand">Ahora</button>}</div></Field>
      </div>
      <label className="mt-4 flex cursor-pointer items-center justify-between gap-3 rounded-xl bg-sunken p-3.5" htmlFor="f-vuelta">

        <Field label="Día de vuelta" htmlFor="f-dia-v"><input id="f-dia-v" type="date" min={f.date} value={f.retDate} onChange={e=>set('retDate',e.target.value)} className={inputCls}/></Field>

        <Stepper id="f-pax" label="pasajeros" value={f.pax} min={1} max={8} onChange={v=>set('pax',v)}/>
      </div>
      {MALETAS.map(m=><div key={m.id} className="flex items-center justify-between gap-3 border-b border-line py-3">
        <div className="flex items-center gap-3"><span className="text-muted"><I.Lug/></span><div><div className="font-semibold">Maleta {m.name.toLowerCase()}</div><div className="text-[13px] text-muted tnum">{m.dims}</div></div></div>
        <Stepper id={'f-mal-'+m.id} label={'maletas '+m.name.toLowerCase()} value={f.luggage[m.id]} max={8} onChange={v=>set('luggage',{...f.luggage,[m.id]:v})}/>
      </div>)}
      <div className={`mt-3 flex items-start gap-3 rounded-xl p-3.5 ${vehicle==='grupo'?(seats<=8&&!staff?'border border-brand bg-brandsoft':'bg-badsoft text-bad'):'bg-sunken'}`}>
        <span className="mt-0.5">{vehicle==='grupo'?(seats<=8&&!staff?<I.CarSide/>:<I.Alert/>):<I.Car/>}</span>
        <div className="text-[14px]">{vehicle==='taxi'&&<><b>Taxi</b> · hasta {maxSeats} plazas{f.extras.golf?` (las bolsas de golf ocupan plaza: vais ${seats})`:''}.{bigBags>4&&<> Con tanto equipaje grande, indícalo en comentarios para confirmar que cabe.</>}</>}
          {vehicle==='grupo'&&<>{seats<=8?<><b>Sois {seats}: os llevamos en una van de hasta 8 plazas.</b> Tiene suplemento: escríbenos por WhatsApp o llama al 937 67 85 71 y te damos el precio.
            <span className="mt-2 flex flex-wrap gap-2">

function WaPreview({b}){
  const msgs=[{t:'Hemos recibido tu reserva',x:`${dayLabel(b.date)} a las ${b.time} · ${tripName(b)} · ${eur(b.grand||b.total)} · Código ${b.id}.${b.paid?' Pago recibido.':''} Te confirmamos en breve.`}];
  if(['asignada','en_camino','completada'].includes(b.status)) msgs.push({t:'Reserva confirmada',x:`Te recogemos ${dayLabel(b.date).toLowerCase()} a las ${b.time}. Si necesitas cambiar algo, responde a este email.`});
  if(b.status==='cancelada') msgs.push({t:'Reserva cancelada',x:'Tu reserva ha sido cancelada. Si no lo esperabas, responde a este email o llámanos.'});
  if(!b.email) return <div className="rounded-2xl border border-dashed border-line p-3 text-[14px] text-muted">Sin email: los avisos se le dan por teléfono.</div>;
  return <div className="rounded-2xl bg-sunken p-3" aria-label="Emails al cliente">
    <div className="mb-2 flex items-center gap-1.5 text-[12px] font-bold uppercase tracking-wider text-muted"><I.Mail size={14}/>Emails automáticos a {b.email}</div>
    <div className="flex flex-col gap-2">{msgs.map((m,i)=><div key={i} className="rounded-xl border border-line bg-surface px-3 py-2 text-[14px]">
      <div className="font-bold text-brandink">{m.t}</div>{m.x}</div>)}</div>
  </div>;
}

/* Email que reciben las telefonistas: texto plano, en orden, listo para pasar al gestor de flotas */
const dmy = iso => { if(!iso) return ''; const d=new Date(iso+'T12:00'); return d.toLocaleDateString('es-ES',{weekday:'short'}).replace('.','')+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); };
function centralEmail(b,bookings){
  const [o,dst]=b.dir==='out'?[b.ss,b.dest]:[b.dest,b.ss];
  const ret=b.roundTrip&&b.linked?(bookings||[]).find(x=>x.id===b.linked):null;
  const lug=b.luggage||{s:0,m:0,l:0};
  const ex=Object.entries(b.extras||{}).filter(([,v])=>v).map(([k,v])=>`${v} × ${(DEFAULT_EXTRAS.find(e=>e.id===k)||{name:k}).name.toLowerCase()}`);
  const vuelta=b.isReturn?`Es la vuelta de la reserva ${b.linked}`:b.roundTrip?`Sí. Vuelta el ${dmy(b.retDate)} a las ${b.retTime}${b.linked?` (reserva ${b.linked})`:''}`:'No';
  const pago=b.paid?'PAGADO online (tarjeta o PayPal)':'PENDIENTE DE PAGO (se cancela sola a los 60 min si no se paga)';
  const L=[
    `Asunto: Nueva reserva web ${b.id} · ${dmy(b.date)} ${b.time} · ${o} → ${dst}`,
    '',
    `Código: ${b.id}`,
    `Recogida: ${dmy(b.date)} a las ${b.time}`,
    `Origen: ${o}`,
    `Destino: ${dst}`,
    `Ida y vuelta: ${vuelta}`,
    `Pasajeros: ${b.pax}`,
    `Maletas: ${lug.s} pequeña${lug.s===1?'':'s'} · ${lug.m} mediana${lug.m===1?'':'s'} · ${lug.l} grande${lug.l===1?'':'s'}`,
    `Extras: ${ex.length?ex.join(', '):'ninguno'}`,
    `Vuelo: ${b.flight||'-'}`,
    `Nombre: ${b.name}`,
    `Teléfono: ${b.phone}`,
    ...(b.email?[`Email: ${b.email}`]:[]),
    `Idioma: ${b.lang}`,
    `Comentarios: ${b.notes||'-'}`,

function EmailCentral({b,bookings}){

/* Mantiene el foco del teclado dentro de un diálogo abierto (Tab / Mayús+Tab) */
function trapFocus(e){ if(e.key!=='Tab') return;
  const f=[...e.currentTarget.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]):not(.sr-only),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
  if(!f.length) return; const first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()} else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()} }

        </div>
        <label className="mt-3 flex min-h-[44px] cursor-pointer items-center gap-3 text-[14px] font-semibold"><input type="checkbox" checked={!!settings.nightWeekends} onChange={e=>up('nightWeekends',e.target.checked)} className="h-5 w-5 shrink-0 accent-[var(--brand)]"/>Sábados, domingos y festivos con tarifa de noche todo el día</label>
        {settings.nightWeekends&&<Field label="Festivos (uno por línea, AAAA-MM-DD)" htmlFor="s-festivos" hint="Festivos de Cataluña ya puestos. Añade las fiestas locales de Santa Susanna."><textarea id="s-festivos" rows={4} value={(settings.holidays||[]).join('\n')} onChange={e=>up('holidays',e.target.value.split(/\s+/).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)))} className={inputCls+' h-auto py-2 tnum'}/></Field>}
        <p className="mt-3 text-[13px] text-muted">Horario de noche según vuestra web (20:00–08:00, fines de semana y festivos).</p>
      </Section>
      <Section title="Pagos online" icon={I.Card}>
        <p className="text-[14px]">Tarjeta y PayPal, con las pasarelas que ya tenéis en WooCommerce. Si un día activáis Bizum, aparece solo. El dinero va directo a vuestra cuenta.</p>
        <p className="mt-2 text-[13px] text-muted">Si un cliente no termina de pagar, la reserva se cancela sola a los 60 minutos.</p>
      </Section>
      <Section title="Extras" icon={I.Lug} aside={<span className="text-[13px] text-muted">Precio con IVA</span>}>
        <div className="divide-y divide-line">{settings.extras.map(e=><div key={e.id} className="flex items-center justify-between gap-3 py-2.5">
          <div className="min-w-0"><div className="font-semibold">{e.name}</div><div className="truncate text-[13px] text-muted">{e.hint}</div></div>
          <div className="flex shrink-0 items-center gap-2 text-[13px] text-muted"><label htmlFor={'s-ex-p-'+e.id}>€</label><input id={'s-ex-p-'+e.id} type="number" min="0" value={e.price} onChange={ev=>upE(e.id,'price',ev.target.value)} className={num}/>
            <label htmlFor={'s-ex-m-'+e.id}>máx.</label><input id={'s-ex-m-'+e.id} type="number" min="1" value={e.max} onChange={ev=>upE(e.id,'max',ev.target.value)} className="h-10 w-14 rounded-lg border border-line bg-surface px-2 text-right tnum outline-none focus:border-brand"/></div>
        </div>)}</div>
      </Section>
      <Section title="Datos de ejemplo" icon={I.Reset}>
        <p className="text-[14px] text-muted">Las reservas de esta demostración son ficticias. Los cambios se guardan solo en este navegador.</p>
        {!confirm?<button onClick={()=>setConfirm(true)} className="mt-3 h-11 rounded-full border border-line px-5 font-semibold">Restablecer datos de ejemplo</button>:
          <div className="mt-3 flex flex-wrap items-center gap-2"><span className="font-semibold">Se perderán las reservas y cambios que hayas hecho.</span>
            <button onClick={()=>{onReset();setConfirm(false)}} className="h-10 rounded-full bg-bad px-4 font-bold text-white dark:text-[#1a0b0a]">Restablecer</button><button onClick={()=>setConfirm(false)} className="h-10 rounded-full px-4 font-semibold">No</button></div>}
      </Section>
    </div>
    <Section title={`Tarifas (${settings.tarifas.length} destinos)`} icon={I.Euro} aside={<span className="text-[13px] text-muted">Desde o hacia Santa Susanna</span>}>
      <div className="mb-3 flex h-11 items-center gap-2 rounded-xl border border-line px-3"><I.Search className="text-muted"/><input id="s-buscar" aria-label="Buscar destino" value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar destino" className="h-full min-w-0 flex-1 bg-transparent outline-none placeholder:text-muted"/></div>
      <div className="max-h-[560px] overflow-auto">
        <table className="w-full text-[14px]"><thead className="sticky top-0 bg-surface text-[12px] uppercase tracking-wider text-muted"><tr><th className="py-2 text-left">Destino</th><th className="py-2 text-right">Día</th><th className="py-2 text-right">Noche</th></tr></thead>
        <tbody className="divide-y divide-line">{tar.map(t=><tr key={t.id}><td className="py-2 pr-2"><div className="font-semibold">{t.name}</div><div className="text-[12px] text-muted">{CAT_LABEL[t.cat]}</div></td>
          <td className="py-2 text-right"><input aria-label={`Tarifa de día ${t.name}`} id={'s-t-d-'+t.id} type="number" min="0" value={t.day} onChange={e=>upT(t.id,'day',e.target.value)} className={num}/></td>
          <td className="py-2 pl-2 text-right"><input aria-label={`Tarifa de noche ${t.name}`} id={'s-t-n-'+t.id} type="number" min="0" value={t.night} onChange={e=>upT(t.id,'night',e.target.value)} className={num}/></td></tr>)}</tbody></table>
      </div>
    </Section>
  </div>;
}

function ThemeSwitch({theme,setTheme,compact}){
  const opts=[['auto','Auto',I.Monitor],['light','Claro',I.Sun],['dark','Oscuro',I.Moon]];
  if(compact){const i=opts.findIndex(o=>o[0]===theme);const n=opts[(i+1)%3];const C=opts[i][2];
    return <button onClick={()=>setTheme(n[0])} aria-label={`Tema: ${opts[i][1]}. Cambiar a ${n[1]}`} className="grid h-11 w-11 shrink-0 place-items-center rounded-full border border-line bg-surface"><C/></button>;}
  return <div className="grid grid-cols-3 gap-1 rounded-xl bg-white/5 p-1" role="group" aria-label="Tema">
    {opts.map(([k,l,C])=><button key={k} onClick={()=>setTheme(k)} aria-pressed={theme===k} className={`flex items-center justify-center gap-1.5 rounded-lg py-1.5 text-[12px] font-semibold ${theme===k?'bg-white text-[#002313]':'text-ondeep hover:bg-white/10'}`}><C size={14}/>{l}</button>)}
  </div>;
}

/* ---------- App ---------- */
const NAV=[['reservas','Reservas',I.List],['ajustes','Tarifas y extras',I.Sliders]];

/* Selector de vista: cliente (web) o central (reservas recibidas) */
function ModeBar({mode,setMode}){
  const opts=[['cliente','Vista del cliente','en la web',I.Navigation],['panel','Vista de la central','reservas recibidas',I.List]];
  return <nav aria-label="Cambiar de vista (demostración)" className="fixed inset-x-0 top-0 z-[35] border-b border-white/10 bg-[#0B1A12] text-white" style={{paddingTop:'env(safe-area-inset-top, 0px)'}}>
    <div className="mx-auto flex h-14 max-w-6xl items-center justify-between gap-3" style={{paddingLeft:'max(16px, env(safe-area-inset-left, 0px))',paddingRight:'max(16px, env(safe-area-inset-right, 0px))'}}>
      <span className="hidden text-[13px] font-semibold text-[#C9DBD1] sm:block">Demostración · cambia de vista para ver cada lado</span>
      <div className="mx-auto grid w-full max-w-md grid-cols-2 gap-1 rounded-full bg-white/10 p-1 sm:mx-0 sm:w-auto" role="tablist" aria-label="Vista">
        {opts.map(([k,l,s,C])=><button key={k} role="tab" aria-selected={mode===k} onClick={()=>setMode(k)}
          className={`flex h-10 items-center justify-center gap-2 rounded-full px-4 text-[14px] font-bold whitespace-nowrap ${mode===k?'bg-[#FFD940] text-[#002313]':'text-white hover:bg-white/10'}`}>
          <C size={16}/><span className="sm:hidden">{k==='cliente'?'Cliente':'Central'}</span><span className="hidden sm:inline">{l}</span></button>)}
      </div>
    </div>
  </nav>;
}

/* Vista del cliente: el formulario tal como iría en su web */
// «Qué incluye tu reserva»: mismo bloque que la home de la web nueva
function TrustBlock(){
  const cards=[[I.Tag,'Precio fijo','Sin sorpresas, sin taxímetro'],[I.CarSide,'Taxi grande','Vans de 6, 7 y 8 plazas · bajo consulta'],[I.ShieldOk,'Seguridad niños','Sillitas y elevadores infantiles'],[I.Lock,'Pago seguro','Tarjeta o PayPal']];
  const tick=<span aria-hidden="true" className="mr-1">✓</span>;
  return <section aria-labelledby="incluye-t" className="mb-8 mt-3">
    <h2 id="incluye-t" className="mb-5 text-center text-[14px] font-extrabold uppercase tracking-[.06em] text-brandink">Qué incluye tu reserva</h2>
    <div className="grid grid-cols-2 gap-3 md:grid-cols-4 xl:grid-cols-[1.9fr_repeat(4,1fr)]">
      <div className="col-span-2 overflow-hidden rounded-2xl border border-[#C9A400] shadow-[0_12px_28px_rgba(0,35,19,.22)] md:col-span-4 xl:col-span-1">
        <div className="bg-gradient-to-r from-[#F3C800] to-[#FFD940] px-5 py-3 text-[13px] font-extrabold uppercase tracking-[.18em] text-[#002313]">Garantía reserva web</div>
        <div className="flex flex-col gap-4 px-5 py-5 text-white" style={{background:'linear-gradient(135deg,#002313 0%,#00562D 100%)'}}>
          <div><h3 className="text-[17px] font-bold"><span aria-hidden="true" className="mr-1 text-[#FFD940]">✓</span>Modifica o cancela sin cargos</h3><p className="mt-1 text-[14px] text-white/90">Hasta <b className="text-[#FFD940]">3h antes</b> sin penalización.</p></div>
          <div className="h-px bg-gradient-to-r from-white/25 to-transparent"/>
          <div><h3 className="text-[17px] font-bold"><span aria-hidden="true" className="mr-1 text-[#FFD940]">✓</span>Garantía de servicio</h3><p className="mt-1 text-[14px] text-white/90">Si no, te devolvemos el <b className="text-[#FFD940]">150%</b> de tu transfer.</p></div>
        </div>
      </div>
      {cards.map(([Ic,t,d])=><div key={t} className="relative flex flex-col items-center rounded-2xl border border-line bg-surface px-3 pb-5 pt-6 text-center">
        <span aria-hidden="true" className="absolute left-1/2 top-0 h-[3px] w-20 -translate-x-1/2 rounded-b bg-gradient-to-r from-[#008F4C] to-[#F3C800]"/>
        <span aria-hidden="true" className="grid h-[68px] w-[68px] place-items-center rounded-full border border-dashed border-line"><span className="grid h-14 w-14 place-items-center rounded-full bg-brandsoft text-ink"><Ic size={24}/></span></span>
        <h3 className="mt-3 text-[16px] font-bold"><span className="text-brandink">{tick}</span>{t}</h3>
        <p className="mt-1.5 text-[14px] leading-snug text-muted">{d}</p>
      </div>)}
    </div>
  </section>;
}
function ClientSite({settings,bookings,onCreate,onSeeInPanel,theme,setTheme}){
  const pad={paddingLeft:'max(16px, env(safe-area-inset-left, 0px))',paddingRight:'max(16px, env(safe-area-inset-right, 0px))'};
  return <div className="min-h-full bg-bg">
    <header className="bg-[#002313] text-white">
      <div className="mx-auto flex max-w-6xl items-center justify-between gap-3 py-3" style={pad}>
        <div className="flex items-center gap-2.5"><img src={LOGO_CREST} alt="" className="h-12 w-auto"/>
          <div className="leading-tight"><div className="text-[19px] font-bold">Taxi</div><div className="text-[15px] font-medium">Santa Susanna</div></div></div>
        <div className="flex items-center gap-3"><div className="text-ink"><ThemeSwitch theme={theme} setTheme={setTheme} compact/></div></div>
      </div>
    </header>
    <main>
    {/* Cabecera de página interior, como /tarifas/ de la web nueva (la foto y «Tu transfer…» son solo de la home) */}
    <section className="text-center text-white" style={{background:'linear-gradient(#002313 0%, #004726 100%)'}}>
      <div className="mx-auto max-w-3xl pb-11 pt-14 sm:pb-14 sm:pt-16" style={pad}>
        <h1 className="text-[32px] font-extrabold leading-tight sm:text-[44px]">Reserva tu taxi <span className="text-[#FFD940]">a precio fijo</span></h1>
        <p className="mt-3 text-[16px] text-white/90 sm:text-[18px]">Precio cerrado al momento. Te enviamos la reserva a tu email al instante.</p>
      </div>
    </section>
    <div className="mx-auto max-w-6xl py-5" style={pad}>
      <TrustBlock/>
      <BookingForm settings={settings} onCreate={onCreate} onSeeInPanel={onSeeInPanel} bookings={bookings}/>
      <p className="mt-6 text-center text-[13px] text-muted">El formulario se muestra en castellano, català o English según el idioma de la web.</p>
    </div>
    </main>
  </div>;
}

const VISTA=(()=>{try{const v=new URLSearchParams(location.search).get('vista');return v==='panel'||v==='cliente'?v:null}catch(e){return null}})();
if(VISTA) document.documentElement.style.setProperty('--mb','0px');
function App(){
  const [intro,setIntro]=useState(()=>!store.get('tss-form-intro'));
  const saved=store.get('tss-formulario-v1');
  const [bookings,setBookings]=useState(()=>{if(saved&&saved.bookings){seq=Math.max(seq,...saved.bookings.map(b=>+String(b.id).slice(3)||0))+1;return saved.bookings}return seed()});
  const [settings,setSettings]=useState(()=>saved&&saved.settings||DEFAULT_SETTINGS);
  const h0=location.hash.replace('#','');
  const [mode,setModeS]=useState(VISTA||(h0==='cliente'||!NAV.some(n=>n[0]===h0)?'cliente':'panel'));
  const [view,setView]=useState(NAV.some(n=>n[0]===h0)?h0:'reservas'); const [sel,setSel]=useState(null); const [toast,setToast]=useState('');
  const [theme,setTheme]=useState(()=>store.get('tss-tema')||'auto');
  useEffect(()=>{const r=document.documentElement;if(theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme);store.set('tss-tema',theme)},[theme]);
  useEffect(()=>{store.set('tss-formulario-v1',{bookings,settings})},[bookings,settings]);
  // Sincroniza con otras ventanas abiertas (p. ej. la vista del cliente y la de la central)
  useEffect(()=>{const h=e=>{if(e.key!=='tss-formulario-v1'||!e.newValue)return;let d;try{d=JSON.parse(e.newValue)}catch(_){return}
    if(d.bookings){seq=Math.max(seq,...d.bookings.map(b=>+String(b.id).slice(3)||0))+1;
      setBookings(prev=>{const nb=d.bookings.filter(b=>!prev.some(p=>p.id===b.id));if(nb.length)setTimeout(()=>setToast(`Nueva reserva de ${nb[nb.length-1].name}`),0);return d.bookings})}
    if(d.settings)setSettings(d.settings)};
    addEventListener('storage',h);return()=>removeEventListener('storage',h)},[]);
  // Si la vista se queda abierta pasada la medianoche, recarga para que las fechas sigan bien (los datos se mantienen)
  useEffect(()=>{const t=setInterval(()=>{if(isoDay(new Date())!==TODAY)location.reload()},60000);return()=>clearInterval(t)},[]);
  useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(''),2600);return()=>clearTimeout(t)}},[toast]);
  const update=(id,patch,logText)=>{const now=new Date().toISOString();
    setBookings(bs=>bs.map(b=>b.id===id?{...b,...patch,log:[...b.log,...(logText?[{at:now,text:logText}]:[])]}:b));if(logText)setToast(logText)};
  const create=b=>{const l=[].concat(b);setBookings(bs=>[...bs,...l]);setToast(l.length>1?`Reservas ${l.map(x=>x.id).join(' y ')} creadas (ida y vuelta)`:`Reserva ${l[0].id} creada`)};
  const current=bookings.find(b=>b.id===sel);
  const pendingN=bookings.filter(b=>b.status==='nueva'&&b.date>=TODAY).length;
  const title={reservas:'Reservas',ajustes:'Tarifas y extras'}[view];
  const sub={reservas:`${bookings.length} reservas en total · ${pendingN} por confirmar`,ajustes:'Precios reales de la web, editables'}[view];
  const setHash=h=>{try{history.replaceState(null,'','#'+h)}catch(e){}};
  const go=v=>{setView(v);setHash(v);window.scrollTo(0,0)};
  const setMode=m=>{setModeS(m);setSel(null);setHash(m==='cliente'?'cliente':view);window.scrollTo(0,0)};
  const seeInPanel=id=>{setModeS('panel');setView('reservas');setHash('reservas');window.scrollTo(0,0);setSel(id)};
  const gut={paddingLeft:'max(16px, env(safe-area-inset-left, 0px))',paddingRight:'max(16px, env(safe-area-inset-right, 0px))'};

  return <div className="min-h-full" style={{paddingTop:'var(--mb)'}}>
    {!VISTA&&<ModeBar mode={mode} setMode={setMode}/>}
    {!VISTA&&intro&&mode==='cliente'&&<section aria-label="Cómo probar la demostración" className="border-b border-line bg-goldsoft">
      <div className="mx-auto flex max-w-6xl flex-col gap-3 py-3 sm:flex-row sm:items-center" style={{paddingLeft:'max(16px, env(safe-area-inset-left, 0px))',paddingRight:'max(16px, env(safe-area-inset-right, 0px))'}}>
        <p className="flex-1 text-[14px] text-ink"><b>Esto es una demostración.</b> Haz una reserva como si fueras un cliente y luego pulsa «Central» arriba para ver cómo le llega a la central. No se cobra nada.</p>
        <button type="button" onClick={()=>{setIntro(false);store.set('tss-form-intro',1)}} className="min-h-[44px] shrink-0 rounded-full bg-deep px-5 text-[14px] font-bold text-white">Entendido</button>
      </div>
    </section>}

    {mode==='cliente'&&<ClientSite settings={settings} bookings={bookings} onCreate={create} onSeeInPanel={VISTA?null:seeInPanel} theme={theme} setTheme={setTheme}/>}

    {mode==='panel'&&<>
    <aside className="fixed bottom-0 left-0 z-30 hidden w-64 flex-col bg-deep p-4 text-ondeep md:flex" style={{top:'var(--mb)',paddingLeft:'max(16px, env(safe-area-inset-left, 0px))'}}>
      <div className="mb-6 px-1"><img src={LOGO_FULL} alt="Taxi Santa Susanna" className="h-14 w-auto"/>
        <div className="mt-2 text-[12px] font-semibold uppercase tracking-wider text-[#FFD940]">Central de reservas</div></div>
      <nav className="flex flex-col gap-1" aria-label="Secciones">{NAV.map(([k,l,C])=><button key={k} onClick={()=>go(k)} aria-current={view===k?'page':undefined}
        className={`flex items-center gap-3 rounded-xl px-3 py-2.5 text-left font-semibold ${view===k?'bg-white text-[#002313]':'text-ondeep hover:bg-white/10'}`}><C/><span className="flex-1">{l}</span>
        {k==='reservas'&&pendingN>0&&<span className="rounded-full bg-[#FFD940] px-2 text-[12px] font-bold text-[#002313] tnum">{pendingN}</span>}</button>)}</nav>
      <div className="mt-auto flex flex-col gap-3">
        <ThemeSwitch theme={theme} setTheme={setTheme}/>
        <div className="rounded-xl bg-white/5 p-3 text-[12px] leading-relaxed text-ondeep">Demostración con datos de ejemplo. Tarifas, hoteles y extras reales de la web.</div>
      </div>
    </aside>

    <main className="md:pl-64">
      <header className="sticky z-20 border-b border-line bg-bg/95 backdrop-blur" style={{top:'var(--mb)'}}>
        <div className="mx-auto flex max-w-6xl items-center justify-between gap-3 py-3" style={gut}>
          <div className="min-w-0"><h1 className="truncate text-[22px] font-extrabold">{title}</h1><p className="truncate text-[13px] text-muted first-letter:uppercase">{sub}</p></div>
          <div className="flex shrink-0 items-center gap-2">
            <span className="md:hidden"><ThemeSwitch theme={theme} setTheme={setTheme} compact/></span>
          </div>
        </div>
      </header>
      <div className="mx-auto max-w-6xl py-5 pb-28 md:pb-10" style={gut}>
        {view==='reservas'&&<Bookings bookings={bookings} open={setSel}/>}
        {view==='ajustes'&&<Settings settings={settings} setSettings={setSettings} onReset={()=>{setBookings(seed());setSettings(DEFAULT_SETTINGS);setToast('Datos de ejemplo restablecidos')}}/>}
      </div>
    </main>

    <nav aria-label="Secciones" className="fixed inset-x-0 bottom-0 z-30 grid grid-cols-2 border-t border-line bg-surface md:hidden" style={{paddingBottom:'env(safe-area-inset-bottom, 0px)',paddingLeft:'env(safe-area-inset-left, 0px)',paddingRight:'env(safe-area-inset-right, 0px)'}}>
      {NAV.map(([k,l,C])=><button key={k} onClick={()=>go(k)} aria-current={view===k?'page':undefined} className={`relative flex min-h-[56px] flex-col items-center justify-center gap-0.5 py-2 text-[13px] font-semibold ${view===k?'text-brandink':'text-muted'}`}>
        <C/>{l}{k==='reservas'&&pendingN>0&&<span className="absolute right-[30%] top-1.5 h-2 w-2 rounded-full bg-[#E9A800]" aria-label={`${pendingN} por confirmar`}></span>}</button>)}
    </nav>

    <Detail key={sel||'none'} b={current} close={()=>setSel(null)} update={update} bookings={bookings} open={setSel} settings={settings}/>
    </>}

    <div aria-live="polite" className="pointer-events-none fixed left-1/2 z-50 -translate-x-1/2" style={{bottom:'calc(env(safe-area-inset-bottom, 0px) + 92px)'}}>
      {toast&&<div className="rounded-full bg-deep px-4 py-2.5 text-[14px] font-semibold text-white shadow-xl">{toast}</div>}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
